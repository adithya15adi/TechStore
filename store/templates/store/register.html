
<!DOCTYPE html>
<html>
<head>
    <title>Register - TechStore</title>
</head>
<body>
    <h1>Create Account</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>

    <p>Already have an account?
        <a href="{% url 'login' %}">Login</a>
    </p>

    <a href="/">Back to Home</a>
</body>
</html>
