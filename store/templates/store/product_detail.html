
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ product.name }} - TechStore</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f7;
            margin: 0;
            color: #222;
        }

        nav {
            background: #222;
            color: white;
            padding: 20px 8%;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .details {
            background: white;
            max-width: 700px;
            margin: 50px auto;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
        }

        .details img {
            width: 250px;
            height: 250px;
            object-fit: contain;
        }

        .price {
            color: #0071e3;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <nav>
        <a href="/">← Back to TechStore</a>
    </nav>

    <div class="details">

        {% if product.image %}
            <img src="{{ product.image.url }}"
                 alt="{{ product.name }}">
        {% else %}
            <div style="font-size: 100px;">📱</div>
        {% endif %}

        <h1>{{ product.name }}</h1>

        <p class="price">₹{{ product.price }}</p>

        <p>{{ product.description }}</p>

        <p>
            Category: {{ product.category.name }}
        </p>

    </div>

</body>
</html>
